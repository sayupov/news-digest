name: Astana evening events

on:
  schedule:
    - cron: '0 14 * * *'  # 19:00 Asia/Almaty (UTC+5)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only: do not send to Telegram'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: astana-evening-events
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and send Astana events guide
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python city_events.py
